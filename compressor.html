<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Compressor Relay Switch</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/mqtt/4.3.7/mqtt.min.js"></script>
  <style>
    body { font-family: Arial, sans-serif; text-align: center; background: #f4f4f9; padding: 20px; }
    .card { background: white; border-radius: 8px; padding: 25px; max-width: 400px; margin: 0 auto; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
    .btn { padding: 15px 30px; font-size: 18px; color: white; border: none; border-radius: 5px; cursor: pointer; margin: 10px; width: 80%; }
    .btn-on { background-color: #28a745; }
    .btn-off { background-color: #dc3545; }
    .status { font-weight: bold; font-size: 20px; }
    #systemMessage { color: #d9534f; font-weight: bold; margin-top: 15px; }
  </style>
</head>
<body>
  <div class="card">
    <h2>120V Compressor Control</h2>
    <p>State: <span id="relayStatus" class="status">Connecting...</span></p>
    <div id="systemMessage"></div>
    <button class="btn btn-on" onclick="sendCommand('ON')">Turn ON</button>
    <button class="btn btn-off" onclick="sendCommand('OFF')">Turn OFF</button>
  </div>

  <script>
    const host = "wss://91edf0b43131429b9a2d60d852310ada.s1.eu.hivemq.cloud:8884/mqtt";
    const options = {
      username: "hticompressor",
      password: "password 90694link",
      clientId: "web_client_" + Math.random().toString(16).substr(2, 8)
    };

    const client = mqtt.connect(host, options);

    client.on('connect', () => {
      document.getElementById('relayStatus').innerText = "Connected";
      client.subscribe('esp32/relay/status');
    });

    client.on('message', (topic, message) => {
      if (topic === 'esp32/relay/status') {
        const msg = message.toString();
        if (msg.startsWith("LOCKED_OUT")) {
          document.getElementById('systemMessage').innerText = "SYSTEM FROZEN: Rapid cycling detected. Locked for 30 minutes.";
        } else if (msg.startsWith("DELAY")) {
          document.getElementById('systemMessage').innerText = "DELAY ACTIVE: Please wait 10 seconds between state changes.";
        } else {
          document.getElementById('systemMessage').innerText = "";
          document.getElementById('relayStatus').innerText = msg;
        }
      }
    });

    function sendCommand(cmd) {
      client.publish('esp32/relay/control', cmd);
    }
  </script>
</body>
</html>
